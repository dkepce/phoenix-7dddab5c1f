<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phoenix</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e2430">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="btnSide" class="ico" title="Show / hide the document list">&#9776;</button>
    <img class="logo" src="icons/logo-bar.png" alt="">
    <b class="brand">Phoenix</b>
    <nav id="tabs">
      <button class="tab on" id="tabWrite">Write</button>
      <button class="tab" id="tabStudy">Study</button>
      <button class="tab" disabled title="Coming later">World</button>
    </nav>
    <span class="grow"></span>
    <button id="fileChip" class="chip"></button>
    <button id="btnMenu" class="ico" title="More">&#8943;</button>
    <div id="menu" hidden></div>
  </header>
  <div id="main">
    <aside id="side">
      <div class="side-head">
        <button id="btnNew" class="primary">+ New document</button>
        <input id="q" type="search" placeholder="Search documents…" autocomplete="off">
      </div>
      <div id="docList"></div>
    </aside>
    <section id="work">
      <div id="titleRow">
        <input id="docTitle" placeholder="Untitled" autocomplete="off" spellcheck="false">
        <select id="docLang" title="Language of this document (spell-check follows it)"></select>
        <button id="btnSetup" title="Page size, margins, fonts, spacing">Page &amp; text…</button>
      </div>
      <div id="toolbar"></div>
      <div id="stage">
        <div id="zoomWrap">
          <div id="paper">
            <div id="sheets"></div>
            <div id="editor" class="doc-body" contenteditable="true" spellcheck="true"></div>
          </div>
        </div>
      </div>
      <footer id="status">
        <span id="stPage"></span><span id="stWords"></span><span id="stChars"></span><span id="stSel"></span>
        <span class="grow"></span>
        <button id="zOut" class="ico sm" title="Zoom out">&minus;</button>
        <input id="zoom" type="range" min="40" max="200" step="5" title="Zoom">
        <button id="zIn" class="ico sm" title="Zoom in">+</button>
        <button id="zVal" class="sm" title="Fit page width"></button>
      </footer>
    </section>
    <section id="study" hidden>
      <div class="study-head">
        <div class="snav">
          <button class="stab on" data-s="comments">Comments</button>
          <button class="stab" data-s="vocab">Vocabulary</button>
          <button class="stab" disabled title="Coming next">Grammar</button>
          <button class="stab" disabled title="Coming next">Examples</button>
        </div>
      </div>
      <div class="study-body" id="cmBody">
        <div id="cmTree"></div>
        <div id="cmPane">
          <div id="cmHead"></div>
          <div id="cmCards"></div>
        </div>
      </div>
      <div class="study-body" id="voBody" hidden>
        <div id="voTree"></div>
        <div id="voPane">
          <div id="voHead"></div>
          <div id="voCards"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<dialog id="dlgComment">
  <form method="dialog" id="cForm">
    <h2 id="cTitle">Comment</h2>
    <blockquote id="cQuote"></blockquote>
    <label class="row1">Type
      <select id="cKind"><option value="note">Note</option><option value="good">Strength</option><option value="fix">To improve</option><option value="lang">Language</option></select>
    </label>
    <textarea id="cText" rows="5" placeholder="Write your comment… (Ctrl+Enter saves)"></textarea>
    <menu>
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="ok" class="primary" id="cOk">Save comment</button>
    </menu>
  </form>
</dialog>

<dialog id="dlgLook">
  <form method="dialog" id="lForm">
    <h2 id="lTitle">Look up</h2>
    <div class="lrow">
      <input id="lWord" placeholder="Word or phrase" autocomplete="off" spellcheck="false">
      <select id="lLang" title="Language of the word"></select>
      <button type="button" id="lGo" class="primary">Look up</button>
    </div>
    <div id="lSug"></div>
    <div id="lRes"></div>
    <label class="lf">Definition <textarea id="lDef" rows="3" placeholder="Click + on a line above to add it, or write your own"></textarea></label>
    <label class="lf">Translation <input id="lTrans" autocomplete="off"></label>
    <label class="lf">Your sentence <textarea id="lSent" rows="2" placeholder="A sentence of yours that uses the word (filled in automatically from your text)"></textarea></label>
    <label class="lf">Note <input id="lNote" autocomplete="off"></label>
    <menu>
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="ok" class="primary" id="lOk">Save to Vocabulary</button>
    </menu>
  </form>
</dialog>

<dialog id="dlgSetup">
  <form method="dialog" id="setupForm">
    <h2>Page &amp; text</h2>
    <div class="cols">
      <fieldset>
        <legend>Page</legend>
        <label>Size <select id="sSize"></select></label>
        <div class="row" id="sCustom"><label>Width <input id="sW" type="number" min="50" max="600" step="0.1"> mm</label><label>Height <input id="sH" type="number" min="50" max="900" step="0.1"> mm</label></div>
        <label>Orientation <select id="sOrient"><option value="p">Portrait</option><option value="l">Landscape</option></select></label>
        <label>Margins <select id="sMargins"></select></label>
        <div class="row m4">
          <label>Top <input id="sMt" type="number" min="0" max="150" step="0.1"></label>
          <label>Right <input id="sMr" type="number" min="0" max="150" step="0.1"></label>
          <label>Bottom <input id="sMb" type="number" min="0" max="150" step="0.1"></label>
          <label>Left <input id="sMl" type="number" min="0" max="150" step="0.1"></label>
        </div>
        <small>Margins in mm.</small>
        <label>Page numbers <select id="sNum"><option value="none">None</option><option value="left">Left</option><option value="center">Centre</option><option value="right">Right</option></select></label>
        <label>Paper colour <select id="sPaper"><option value="paper">Cream paper</option><option value="white">White</option><option value="night">Night</option></select></label>
      </fieldset>
      <fieldset>
        <legend>Text</legend>
        <label>Font <select id="tFont"></select></label>
        <label>Size <input id="tSize" type="number" min="6" max="48" step="0.5"> pt</label>
        <label>Line spacing <select id="tLh"><option value="1">1.0</option><option value="1.15">1.15</option><option value="1.3">1.3</option><option value="1.5">1.5</option><option value="1.8">1.8</option><option value="2">2.0</option></select></label>
        <label>Space between paragraphs <select id="tPs"><option value="0">None</option><option value="0.3">Small</option><option value="0.6">Medium</option><option value="1">Large</option></select></label>
        <label class="chk"><input id="tIndent" type="checkbox"> Indent the first line of each paragraph</label>
        <small>These are this document's base settings. Selected text can still get its own size or font from the toolbar.</small>
        <label class="chk"><input id="sDefault" type="checkbox" checked> Use these settings for new documents too</label>
      </fieldset>
    </div>
    <menu>
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="ok" class="primary" id="setupOk">Apply</button>
    </menu>
  </form>
</dialog>

<div id="toast" hidden></div>
<input id="restoreInput" type="file" accept=".phx,application/json" hidden>
<div id="print"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
<script src="js/study.js"></script>
<script src="js/vocab.js"></script>
<script src="js/init.js"></script>
</body>
</html>
